# mongoman — Continuous Integration
#
# Runs on every push and PR to verify the codebase builds and tests pass.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22', '1.23', '1.24']
        include:
          - go-version: '1.24'
            os: ubuntu-latest
          - go-version: '1.24'
            os: macos-latest
          - go-version: '1.24'
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true

      - name: Run tests
        run: go test ./... -v

      - name: Build
        run: go build -o /dev/null .

      - name: Vet
        run: go vet ./...