# mongoman — Automated Release Pipeline
#
# Triggered by pushing a tag matching v*.*.* (e.g., v1.0.0).
# Builds binaries for all supported platforms and creates a GitHub Release
# with platform-specific archives.
#
# After a release is published:
#   - Homebrew users: brew tap quabynahdavis/mongoman && brew install mongoman
#   - Scoop users:    scoop bucket add mongoman https://github.com/quabynahdavis/scoop-mongoman
#                     scoop install mongoman
#   - Everyone else:  Download the archive for their platform from the release page

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to release (e.g., v0.0.1)'
        required: true
        type: string
      tag_name:
        description: 'Git tag to build from (default: HEAD)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: "386"
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: "386"
          - goos: freebsd
            goarch: amd64
          - goos: openbsd
            goarch: amd64
          - goos: netbsd
            goarch: amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          APP="mongoman"
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          VERSION="${{ github.event.inputs.version }}"
          CGO_ENABLED=0 go build -ldflags="-s -w -X main.Version=${VERSION#v}" \
            -o "${APP}${EXT}" .

      - name: Create archive
        shell: bash
        run: |
          APP="mongoman"
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          if [ "${{ matrix.goos }}" = "windows" ]; then
            # Windows: produce a .zip (tar is not guaranteed on bare Windows shells)
            ARCHIVE="${APP}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
            powershell -Command \
              "Compress-Archive -Path '${APP}${EXT}',README.md,LICENSE -DestinationPath '${ARCHIVE}' -Force"
          else
            # Unix: produce a .tar.gz
            ARCHIVE="${APP}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
            tar -czf "${ARCHIVE}" "${APP}${EXT}" README.md LICENSE 2>/dev/null || \
              tar -czf "${ARCHIVE}" "${APP}${EXT}"
          fi
          echo "archive=${ARCHIVE}" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mongoman_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ env.archive }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate checksums
        shell: bash
        run: |
          cd artifacts
          find . \( -name '*.tar.gz' -o -name '*.zip' \) -print0 \
            | xargs -0 -I{} sh -c 'echo "{}" && sha256sum "{}"' \
            | tee checksums.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: mongoman ${{ github.event.inputs.version }}
          body: |
            ## mongoman ${{ github.event.inputs.version }}

            ### Installation

            **Linux / macOS:**
            ```bash
            # Download and extract
            tar -xzf mongoman_linux_amd64.tar.gz
            sudo mv mongoman /usr/local/bin/
            ```

            **Windows:**
            Download `mongoman_windows_amd64.zip`, extract it, and add `mongoman.exe` to your PATH.

            **Homebrew (macOS/Linux):**
            ```bash
            brew tap quabynahdavis/mongoman
            brew install mongoman
            ```

            **Scoop (Windows):**
            ```powershell
            scoop bucket add mongoman https://github.com/quabynahdavis/scoop-mongoman
            scoop install mongoman
            ```

            **Go install:**
            ```bash
            go install github.com/quabynahdavis/mongoman@latest
            ```

            ### Checksums
            ```
            $(cat artifacts/checksums.txt)
            ```
          files: artifacts/**/*.tar.gz, artifacts/**/*.zip
          draft: false
          prerelease: false
